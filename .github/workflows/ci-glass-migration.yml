name: Glass Migration CI

on:
  push:
    branches: [ main, demo-glass-component ]
  pull_request:
    branches: [ main, demo-glass-component ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run unit tests
      run: npm test

    - name: Run legacy guard tests
      run: npm run test:legacy-guard

    - name: Run theme consistency tests
      run: npm run test:theme

    - name: Start dev server
      run: PORT=4000 npm run dev &
      env:
        BASE_URL: http://localhost:4000

    - name: Wait for server
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:4000 > /dev/null 2>&1; do sleep 2; done'

    - name: Run E2E tests
      run: npm run e2e:smoke
      env:
        BASE_URL: http://localhost:4000

    - name: Run performance check
      run: npm run lighthouse
      env:
        BASE_URL: http://localhost:4000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results/
          reports/
          playwright-report/